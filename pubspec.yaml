name: fridge_note
description: "A shared shopping list for couples and roommates that works offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  bloc: ^9.2.1
  connectivity_plus: ^7.3.2
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  home_widget: ^0.10.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  sqlite3: ^2.9.4
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
